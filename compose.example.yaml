# FRESH-DEMO TEMPLATE, not an export of any running installation.
name: oracle-enterprise-ai-share-demo
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_DB: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init_env and check_config first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U openwebui -d openwebui']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  oci-gateway:
    build: ./oci-gateway
    restart: unless-stopped
    environment:
      OCI_GATEWAY_KEY: ${OCI_GATEWAY_KEY:?Run init_env first}
      OCI_REGION: ${OCI_REGION:?Set your OCI region}
      OCI_COMPARTMENT_ID: ${OCI_COMPARTMENT_ID:?Set your OCI compartment}
    # No published gateway port; only containers on this Compose network.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *bounded-logs

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:8080'
    environment:
      DATABASE_URL: postgresql://openwebui:${POSTGRES_PASSWORD:?Set password}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set signing key}
      WEBUI_URL: ${WEBUI_URL:?Set browser-visible WebUI address}
      WEBUI_AUTH: 'true'
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: pending
      ENABLE_OLLAMA_API: 'false'
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: http://oci-gateway:4000/v1
      OPENAI_API_KEY: ${OCI_GATEWAY_KEY:?Set gateway key}
    volumes:
      - webui-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      oci-gateway:
        condition: service_healthy
    logging: *bounded-logs

volumes:
  postgres-data:
  webui-data:

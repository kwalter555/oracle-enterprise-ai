schemaVersion: 1.1.0
version: "2026.10.02"
locale: en
title: Oracle Enterprise AI Demo
description: New isolated OCI infrastructure with a prepared Docker VM and Autonomous Transaction Processing database. SQL installation and application startup are manual.
stackDescription: Paid demo resources only. Review Plan before Apply. Does not modify an existing environment.
informationalText: Credentials are generated on the VM, except the database ADMIN password, which is stored in protected Terraform state. No application, SQL, or model requests are started automatically.
allowViewState: false

variableGroups:
  - title: Destination and cost acknowledgement
    variables: [tenancy_ocid, compartment_ocid, region, home_region, availability_domain, name_prefix, acknowledge_costs]
  - title: Administrator access and new network
    variables: [admin_cidr, ssh_public_key, vcn_cidr]
  - title: Application VM
    variables: [vm_shape, vm_ocpus, vm_memory_gb, boot_volume_gb]
  - title: OCI Generative AI and IAM
    variables: [genai_region, create_iam]
  - title: New Autonomous Transaction Processing database
    variables: [adb_name, adb_admin_password, adb_ecpus, adb_storage_gb, enable_mcp]

variables:
  tenancy_ocid:
    type: string
    visible: false
  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Existing demo compartment
    description: Select a dedicated compartment, not the tenancy root. All new resources and GenAI permissions are scoped here.
  region:
    type: oci:identity:region:name
    required: true
    visible: false
    title: Deployment region
  home_region:
    type: oci:identity:region:name
    required: true
    title: Tenancy home region
    description: Must be your tenancy's actual home region, even if deployment is elsewhere.
  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    title: VM availability domain
    dependsOn:
      compartmentId: compartment_ocid
  name_prefix:
    type: string
    required: true
    title: Unique environment prefix
    default: enterprise-ai-demo
    pattern: '^[a-z][a-z0-9-]{2,24}$'
  acknowledge_costs:
    type: boolean
    default: false
    title: I have reviewed the costs of these paid resources
    description: This is NOT Always Free. VM, storage, database and subsequent model calls may incur charges.
  admin_cidr:
    type: string
    required: true
    title: Your public IPv4 address with /32
    description: SSH and direct database access are restricted to this one address. Do not enter a private LAN address.
    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  ssh_public_key:
    type: string
    required: true
    title: One SSH public key
    description: Paste one public key. Never upload the private key.
  vcn_cidr:
    type: string
    required: true
    title: New private VCN range
    default: 10.42.0.0/16
    description: Choose a non-overlapping 10.x.0.0/16. The VM uses its first /24.
  vm_shape:
    type: enum
    enum: [VM.Standard.E4.Flex, VM.Standard.E5.Flex]
    default: VM.Standard.E4.Flex
    required: true
    title: x86 VM shape
  vm_ocpus:
    type: integer
    default: 2
    minimum: 2
    maximum: 4
    title: VM OCPUs
  vm_memory_gb:
    type: integer
    default: 16
    minimum: 16
    maximum: 32
    title: VM memory (GB)
  boot_volume_gb:
    type: integer
    default: 100
    minimum: 100
    maximum: 250
    title: VM boot/data volume (GB)
  genai_region:
    type: oci:identity:region:name
    default: eu-frankfurt-1
    required: true
    title: GenAI region
    description: Verify model availability, quotas, and processing terms separately. SQL profile region must be configured to match.
  create_iam:
    type: boolean
    default: true
    title: Create exact-resource dynamic groups and GenAI policies
    description: Requires IAM administration rights in the default identity domain. For a custom domain, disable and follow the manual IAM instructions.
  adb_name:
    type: string
    required: true
    default: ENTAIDEMO
    title: New database name
    pattern: '^[A-Za-z][A-Za-z0-9]{0,13}$'
  adb_admin_password:
    type: password
    required: true
    confirmation: true
    title: New database ADMIN password
    description: 12-30 characters with uppercase, lowercase and digits; no double quote or word admin. This value remains in protected Terraform state.
  adb_ecpus:
    type: integer
    default: 2
    minimum: 2
    maximum: 8
    title: Database ECPUs (2, 4 or 8)
  adb_storage_gb:
    type: integer
    default: 20
    minimum: 20
    maximum: 100
    title: Transaction Processing storage (GB)
    description: Starts at 20 GB. This Stack creates a new OLTP database, not a Data Warehouse database.
  enable_mcp:
    type: boolean
    default: false
    title: Enable database MCP endpoint
    description: Leave off until SQL users/tools and access controls are reviewed. Then update this variable and review a new Plan.

outputs:
  instance_public_ip:
    type: string
    title: SSH host
  ssh_tunnel:
    type: string
    title: SSH tunnel command (use your own private key path)
  database_ocid:
    type: string
    title: New database OCID
  mcp_endpoint:
    type: string
    title: MCP endpoint (manual setup required)
  next_steps:
    type: string
    title: Required post-deployment steps
